# Whole stack on one machine:  docker compose up --build
#   app  http://localhost:8080      api  http://localhost:7000
# Sign-up emails an OTP through Brevo: put BREVO_API_KEY in a .env file next to this one.
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      PORT: 7000
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/smart-expense
      # Local-only default. Set a real secret in a .env file next to this one for anything shared.
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      ALLOWED_ORIGINS: http://localhost:8080
      # Sign-up OTP emails go through the Brevo HTTP API; without a key, sign-up cannot finish.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    ports:
      - "7000:7000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
